name: VSF Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-quality-gate:
    name: Backend Build & Test Gate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK 8.0.x
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Backend Dependencies
      run: dotnet restore backend/FashionWeb.sln

    - name: Build Backend (Warnings as Errors)
      run: dotnet build backend/FashionWeb.sln --configuration Release --no-restore

    - name: Run Backend Unit Tests
      run: dotnet test backend/FashionWeb.sln --configuration Release --no-build --verbosity normal

  frontend-quality-gate:
    name: Frontend Typecheck & Build Gate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      run: npm ci

    - name: Typecheck Frontend
      run: npm run typecheck

    - name: Build Frontend Production Bundle
      run: npm run build
